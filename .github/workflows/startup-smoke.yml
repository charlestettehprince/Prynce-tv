name: PRYNCE TV startup smoke benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/startup-smoke.yml"
      - ".gitmodules"
      - "android/upstream"
      - "scripts/startup-smoke.sh"

permissions:
  contents: read

concurrency:
  group: prynce-tv-startup-smoke
  cancel-in-progress: true

jobs:
  startup-smoke:
    name: Measure Android activity launch timing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PRYNCE TV and pinned OpenTV engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/upstream/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Build the pinned app debug variant
        working-directory: android/upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Run repeatable startup samples on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: sh scripts/startup-smoke.sh

      - name: Upload startup measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prynce-tv-startup-smoke-results
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30
