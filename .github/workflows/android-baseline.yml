name: PRYNCE TV Android build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-baseline.yml"
      - ".gitmodules"
      - "android/**"
      - "branding/**"
      - "scripts/**"

concurrency:
  group: prynce-tv-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-upstream-baseline:
    name: Build PRYNCE TV branded Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRYNCE TV project and pinned Android source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Upgrade build configuration for Android 16 API 36
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          versions = Path("gradle/libs.versions.toml")
          text = versions.read_text()
          if text.count('agp = "8.7.3"') != 1:
              raise SystemExit("Expected AGP 8.7.3 pin not found exactly once.")
          versions.write_text(text.replace('agp = "8.7.3"', 'agp = "8.9.1"', 1))

          app = Path("app/build.gradle.kts")
          text = app.read_text()
          if text.count("compileSdk = 35") != 1 or text.count("targetSdk = 35") != 1:
              raise SystemExit("Expected compileSdk/targetSdk 35 declarations not found exactly once.")
          text = text.replace("compileSdk = 35", "compileSdk = 36", 1)
          text = text.replace("targetSdk = 35", "targetSdk = 36", 1)
          app.write_text(text)
          print("Configured AGP 8.9.1, compileSdk 36 and targetSdk 36.")
          PY

      - name: Install PRYNCE TV launcher artwork from original vector sources
        run: |
          mkdir -p android/upstream/app/src/main/res/drawable
          rm -f android/upstream/app/src/main/res/drawable/ic_launcher.png android/upstream/app/src/main/res/drawable/banner.png
          python3 -m venv /tmp/prynce-art-venv
          /tmp/prynce-art-venv/bin/pip install --quiet CairoSVG
          /tmp/prynce-art-venv/bin/python - <<'PY'
          from pathlib import Path
          from base64 import b64encode
          import cairosvg

          out = Path("android/upstream/app/src/main/res/drawable")
          icon_source = Path("branding/prynce_icon.svg")
          wordmark_source = Path("branding/prynce_wordmark.svg")
          for source in (icon_source, wordmark_source):
              if not source.is_file() or "<svg" not in source.read_text():
                  raise SystemExit(f"Missing or invalid original vector artwork: {source}")

          icon_png = cairosvg.svg2png(url=str(icon_source), output_width=512, output_height=512)
          wordmark_png = cairosvg.svg2png(url=str(wordmark_source), output_width=165, output_height=52)
          (out / "ic_launcher.png").write_bytes(icon_png)
          # Preserve the supplied PRYNCE icon and wordmark as separate in-app assets.
          (out / "ic_prynce_brand.png").write_bytes(icon_png)
          (out / "ic_prynce_wordmark.png").write_bytes(wordmark_png)

          icon_uri = "data:image/png;base64," + b64encode(icon_png).decode("ascii")
          wordmark_uri = "data:image/png;base64," + b64encode(wordmark_png).decode("ascii")
          banner_svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
            <rect width="320" height="180" fill="#080B14"/>
            <image href="{icon_uri}" x="8" y="8" width="164" height="164"/>
            <image href="{wordmark_uri}" x="150" y="64" width="160" height="51"/>
            <path d="M178 126H300" stroke="#D4AF37" stroke-opacity=".7" stroke-width="2"/>
          </svg>"""
          cairosvg.svg2png(bytestring=banner_svg.encode(), write_to=str(out / "banner.png"))
          PY

      - name: Generate PRYNCE adaptive, themed and notification icons
        working-directory: android/upstream
        run: |
          set -euo pipefail
          /tmp/prynce-art-venv/bin/python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import cairosvg

          res = Path("app/src/main/res")
          source = Path("../../branding/prynce_icon.svg")
          root = ET.parse(source).getroot()
          paths = [node.attrib.get("d", "") for node in root.iter() if node.tag.endswith("path")]
          main = next((d for d in paths if d.startswith("M153 394")), None)
          star = next((d for d in paths if d.startswith("M362 87")), None)
          if not main or not star:
              raise SystemExit("Could not isolate the original PRYNCE P and star marks from the supplied SVG.")

          # The foreground keeps the original P silhouette, centred within Android's 66dp safe zone.
          mark = f'<g transform="translate(-29 0)"><path d="{main}" fill="#D8A83E"/><path d="{star}" fill="#D8A83E"/></g>'
          mono = f'<g transform="translate(-29 0)"><path d="{main}" fill="#FFFFFF"/><path d="{star}" fill="#FFFFFF"/></g>'
          foreground_svg = f'<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">{mark}</svg>'
          monochrome_svg = f'<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">{mono}</svg>'

          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "drawable" / "ic_prynce_adaptive_foreground.png").write_bytes(
              cairosvg.svg2png(bytestring=foreground_svg.encode(), output_width=512, output_height=512)
          )
          (res / "drawable" / "ic_prynce_monochrome.png").write_bytes(
              cairosvg.svg2png(bytestring=monochrome_svg.encode(), output_width=512, output_height=512)
          )
          # Android status-bar notification small icons must be a simple white silhouette on transparency.
          notification_svg = f'<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><g transform="translate(-29 0) translate(256 256) scale(1.28) translate(-256 -256)"><path d="{main}" fill="#FFFFFF"/></g></svg>'
          (res / "drawable" / "ic_prynce_notification.png").write_bytes(
              cairosvg.svg2png(bytestring=notification_svg.encode(), output_width=96, output_height=96)
          )

          (res / "values").mkdir(parents=True, exist_ok=True)
          (res / "values" / "prynce_icon_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="prynce_icon_background">#07162F</color></resources>\n'
          )
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/prynce_icon_background" />
              <foreground android:drawable="@drawable/ic_prynce_adaptive_foreground" />
              <monochrome android:drawable="@drawable/ic_prynce_monochrome" />
          </adaptive-icon>
          ''')

          # Legacy launcher fallback for Android versions before adaptive icons.
          for density, size in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(url=str(source), write_to=str(folder / "ic_launcher.png"), output_width=size, output_height=size)

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          old = 'android:icon="@drawable/ic_launcher"'
          new = 'android:icon="@mipmap/ic_launcher"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Could not find the app launcher icon attribute in AndroidManifest.xml.")
          if 'android:roundIcon=' not in text:
              text = text.replace(new, new + '\n        android:roundIcon="@mipmap/ic_launcher"', 1)
          manifest.write_text(text)

          # Replace only notification small-icon references; keep app navigation art separate.
          for path in Path("app/src/main/java").rglob("*.kt"):
              text = path.read_text()
              updated = text.replace(
                  ".setSmallIcon(R.drawable.ic_opentv_logo)",
                  ".setSmallIcon(R.drawable.ic_prynce_notification)",
              )
              if updated != text:
                  path.write_text(updated)

          parsed = ET.parse(manifest).getroot()
          app = parsed.find("application")
          android = "{http://schemas.android.com/apk/res/android}"
          assert app is not None and app.get(android + "icon") == "@mipmap/ic_launcher"
          assert app.get(android + "roundIcon") == "@mipmap/ic_launcher"
          assert (adaptive / "ic_launcher.xml").is_file()
          assert (res / "drawable" / "ic_prynce_notification.png").is_file()
          assert "ic_prynce_notification" in "".join(p.read_text() for p in Path("app/src/main/java").rglob("*.kt"))
          print("PRYNCE adaptive, themed, legacy and monochrome notification icons are generated and wired.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/upstream/**/*.gradle*

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Package and validate the official Ghana TV directory
        run: |
          mkdir -p android/upstream/app/src/main/assets
          cp catalog/ghana-tv-directory.json android/upstream/app/src/main/assets/prynce-ghana-tv-directory.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("android/upstream/app/src/main/assets/prynce-ghana-tv-directory.json")
          data = json.loads(p.read_text())
          assert data["product"] == "PRYNCE TV"
          assert data["policy"]["playerOnly"] is True
          assert data["policy"]["noScrapedStreams"] is True
          for item in data["entries"]:
              assert item["destination"].startswith("https://"), item["id"]
              assert item["destinationType"].startswith("official_"), item["id"]
              assert item["verifiedOn"], item["id"]
          print(f"Validated and packaged {len(data['entries'])} official Ghana TV destinations.")
          PY

      - name: Verify Android phone and TV launcher resources
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("app/src/main/AndroidManifest.xml")
          root = ET.parse(manifest).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          assert app is not None, "Android application element is missing"

          icon_value = app.get(android + "icon", "")
          assert icon_value == "@mipmap/ic_launcher", f"Expected PRYNCE adaptive launcher icon, found: {icon_value}"
          assert (Path("app/src/main/res/mipmap-anydpi-v26") / "ic_launcher.xml").is_file(), "Adaptive icon XML is missing"
          assert (Path("app/src/main/res/mipmap-mdpi") / "ic_launcher.png").is_file(), "Legacy launcher fallback is missing"
          banner_value = app.get(android + "banner", "")
          assert banner_value.startswith("@drawable/"), f"Missing Android TV banner drawable: {banner_value}"
          banner_name = banner_value.split("/", 1)[1]
          assert list(Path("app/src/main/res").glob(f"drawable*/{banner_name}.*")), f"Referenced TV banner not found: {banner_value}"
          assert app.get(android + "roundIcon") == "@mipmap/ic_launcher", "Round launcher icon is not wired"
          assert (Path("app/src/main/res/drawable") / "ic_prynce_notification.png").is_file(), "PRYNCE notification icon is missing"

          categories = {
              item.get(android + "name")
              for activity in root.findall(".//activity")
              for intent in activity.findall("intent-filter")
              for item in intent.findall("category")
          }
          assert "android.intent.category.LAUNCHER" in categories, "Phone launcher category is missing"
          assert "android.intent.category.LEANBACK_LAUNCHER" in categories, "Android TV launcher category is missing"
          print("Phone and Android TV launcher declarations and referenced artwork are present.")
          PY

      - name: Configure the built-in updater for PRYNCE TV releases
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checker = Path("app/src/main/java/app/opentv/update/UpdateChecker.kt")
          text = checker.read_text()
          old = 'const val REPO_SLUG = "opentvproject/opentv"'
          new = 'const val REPO_SLUG = "charlestettehprince/Prynce-tv"'
          if old not in text:
              raise SystemExit("Expected upstream updater repository setting was not found; review source before building.")
          checker.write_text(text.replace(old, new, 1))

          screen = Path("app/src/main/java/app/opentv/update/UpdateScreen.kt")
          text = screen.read_text()
          text = text.replace("OpenTV ${s.update.versionName} is available.", "PRYNCE TV ${s.update.versionName} is available.")
          text = text.replace("Could not download the update.", "Could not download the PRYNCE TV update.")
          screen.write_text(text)

          assert 'const val REPO_SLUG = "charlestettehprince/Prynce-tv"' in checker.read_text()
          assert "PRYNCE TV" in screen.read_text()
          print("Updater now checks the PRYNCE TV release repository.")
          PY

      - name: Apply PRYNCE TV black-and-gold branding
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path("app/src/main/res/values/strings.xml")
          text = strings.read_text()
          text = re.sub(r'(<string name="app_name">).*?(</string>)', lambda m: m.group(1) + "PRYNCE TV" + m.group(2), text, count=1)
          text = re.sub(r'(<string name="exit_title">).*?(</string>)', lambda m: m.group(1) + "Leave PRYNCE TV?" + m.group(2), text, count=1)
          strings.write_text(text)

          colors = Path("app/src/main/res/values/colors.xml")
          text = colors.read_text().replace("#FF7C93FF", "#FFD4AF37")
          colors.write_text(text)

          theme = Path("app/src/main/java/app/opentv/ui/theme/Theme.kt")
          text = theme.read_text()
          text = text.replace("0xFF7C93FF", "0xFFD4AF37")
          text = text.replace("0xFF4B5DB8", "0xFF8A6D1D")
          text = text.replace("0xFF3B4FCC", "0xFF9A7820")
          theme.write_text(text)

          # PRYNCE launcher art is installed from committed source-derived assets.

          # Keep the in-app navigation brand consistent with the launcher and app label.
          main_screen = Path("app/src/main/java/app/opentv/ui/MainScreen.kt")
          text = main_screen.read_text()
          text = text.replace('"OpenTV"', '"PRYNCE TV"')
          main_screen.write_text(text)
          PY

      - name: Apply original PRYNCE icon and wordmark inside the app
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          screen = Path("app/src/main/java/app/opentv/ui/MainScreen.kt")
          text = screen.read_text()
          text, icon_count = re.subn(
              r"painterResource\(R\.drawable\.ic_opentv_logo\)",
              "painterResource(R.drawable.ic_prynce_brand)",
              text,
              count=1,
          )
          text = text.replace('contentDescription = "OpenTV"', 'contentDescription = "PRYNCE TV"')
          wordmark = """                Image(
                    painter = painterResource(R.drawable.ic_prynce_wordmark),
                    contentDescription = "PRYNCE TV wordmark",
                    modifier = Modifier.size(width = 96.dp, height = 30.dp),
                )"""
          pattern = r'Text\(\s*"PRYNCE TV",\s*style = MaterialTheme\.typography\.titleLarge,.*?overflow = TextOverflow\.Ellipsis,\s*\)'
          text, wordmark_count = re.subn(pattern, lambda _: wordmark, text, count=1, flags=re.S)
          if icon_count != 1:
              raise SystemExit(f"Expected one upstream rail icon reference; replaced {icon_count}.")
          if wordmark_count != 1 and "R.drawable.ic_prynce_wordmark" not in text:
              raise SystemExit("Could not locate the expanded navigation wordmark slot.")
          if "R.drawable.ic_prynce_brand" not in text or "R.drawable.ic_prynce_wordmark" not in text:
              raise SystemExit("PRYNCE icon/wordmark integration did not validate.")
          screen.write_text(text)
          print("Expanded navigation rail now shows the original PRYNCE icon and wordmark.")
          PY

      - name: Integrate the PRYNCE TV Ghana directory screen
        working-directory: android/upstream
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/app/opentv/ui
          cp ../../android/patches/GhanaTvScreen.kt app/src/main/java/app/opentv/ui/GhanaTvScreen.kt
          cp ../../android/patches/LocalMediaScreen.kt app/src/main/java/app/opentv/ui/LocalMediaScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/app/opentv/ui/MainScreen.kt")
          text = main.read_text()
          old = "    RECORDINGS(R.string.nav_recordings, Icons.Filled.FiberManualRecord),\n}"
          new = "    RECORDINGS(R.string.nav_recordings, Icons.Filled.FiberManualRecord),\n    GHANA_TV(R.string.nav_ghana_tv, Icons.Filled.Tv),\n}"
          if "GHANA_TV(R.string.nav_ghana_tv" not in text:
              if old not in text:
                  raise SystemExit("Could not find Tab enum insertion point")
              text = text.replace(old, new, 1)
          old_case = "                Tab.RECORDINGS -> RecordingsScreen(onPlay = onPlayRecording)"
          new_case = old_case + "\n                Tab.GHANA_TV -> GhanaTvScreen()"
          if "Tab.GHANA_TV -> GhanaTvScreen()" not in text:
              if old_case not in text:
                  raise SystemExit("Could not find main tab content insertion point")
              text = text.replace(old_case, new_case, 1)
          main.write_text(text)

          # Keep the new destination visible in the navigation rail.
          text = main.read_text()
          old_tabs = "            add(Tab.RECORDINGS)\n        }"
          new_tabs = "            add(Tab.RECORDINGS)\n            add(Tab.GHANA_TV)\n        }"
          if "add(Tab.GHANA_TV)" not in text:
              if old_tabs not in text:
                  raise SystemExit("Could not find visible navigation tab list")
              text = text.replace(old_tabs, new_tabs, 1)
              main.write_text(text)

          strings = Path("app/src/main/res/values/strings.xml")
          xml = strings.read_text()
          if 'name="nav_ghana_tv"' not in xml:
              pos = xml.rfind("</resources>")
              if pos < 0:
                  raise SystemExit("strings.xml closing resources tag missing")
              xml = xml[:pos] + '    <string name="nav_ghana_tv">Ghana TV</string>\n' + xml[pos:]
          strings.write_text(xml)
          # Add local file selection using Android SAF; no broad storage permission.
          text = main.read_text()
          if "LOCAL_MEDIA(R.string.nav_local_media" not in text:
              text = text.replace(
                  "    GHANA_TV(R.string.nav_ghana_tv, Icons.Filled.Tv),",
                  "    GHANA_TV(R.string.nav_ghana_tv, Icons.Filled.Tv),\n    LOCAL_MEDIA(R.string.nav_local_media, Icons.Filled.Movie),",
                  1,
              )
          if "onPlayLocalMedia: (android.net.Uri) -> Unit" not in text:
              text = text.replace(
                  "    onPlayRecording: (Recording) -> Unit,",
                  "    onPlayRecording: (Recording) -> Unit,\n    onPlayLocalMedia: (android.net.Uri) -> Unit,",
                  1,
              )
          if "Tab.LOCAL_MEDIA -> LocalMediaScreen(onPlayLocalMedia)" not in text:
              text = text.replace(
                  "                Tab.GHANA_TV -> GhanaTvScreen()",
                  "                Tab.GHANA_TV -> GhanaTvScreen()\n                Tab.LOCAL_MEDIA -> LocalMediaScreen(onPlayLocalMedia)",
                  1,
              )
          text = text.replace("            add(Tab.GHANA_TV)\n        }", "            add(Tab.GHANA_TV)\n            add(Tab.LOCAL_MEDIA)\n        }", 1)
          main.write_text(text)

          strings_text = strings.read_text()
          if 'name="nav_local_media"' not in strings_text:
              pos = strings_text.rfind("</resources>")
              strings_text = strings_text[:pos] + '    <string name="nav_local_media">My Videos</string>\n' + strings_text[pos:]
              strings.write_text(strings_text)

          activity = Path("app/src/main/java/app/opentv/MainActivity.kt")
          activity_text = activity.read_text()
          marker = "                    activeProfileName = activeProfileName,"
          callback = marker + """
                    onPlayLocalMedia = { uri ->
                        navController.navigate(
                            Routes.vodPlayer(key = "local:" + uri.toString(), url = uri.toString(), title = uri.lastPathSegment ?: "Local video", ua = ""),
                        )
                    },"""
          if "onPlayLocalMedia = { uri ->" not in activity_text:
              if marker not in activity_text:
                  raise SystemExit("Could not find MainActivity home-screen callback insertion point")
              activity_text = activity_text.replace(marker, callback, 1)
              activity.write_text(activity_text)

          assert "Tab.LOCAL_MEDIA -> LocalMediaScreen(onPlayLocalMedia)" in main.read_text()
          assert "onPlayLocalMedia = { uri ->" in activity.read_text()
          assert 'name="nav_local_media"' in strings.read_text()
          print("Ghana TV and local video picker connected to navigation and player.")
          PY

      - name: Validate committed artwork dimensions and opacity
        run: |
          /tmp/prynce-art-venv/bin/python - <<'PY'
          from PIL import Image
          icon = Image.open("android/upstream/app/src/main/res/drawable/ic_launcher.png")
          banner = Image.open("android/upstream/app/src/main/res/drawable/banner.png")
          assert icon.size == (512, 512), f"Prepared launcher icon must be 512x512; found {icon.size}"
          assert banner.size == (320, 180), f"Prepared TV banner must be 320x180; found {banner.size}"
          assert banner.mode == "RGB", f"Prepared TV banner must be opaque RGB; found {banner.mode}"
          print("Prepared store icon and opaque Android TV banner dimensions passed.")
          PY

      - name: Apply reviewed Android lint compatibility patches
        working-directory: android/upstream
        run: |
          set -euo pipefail
          python3 ../../scripts/apply_android_lint_fixes.py
          cp ../../android/patches/lint.xml lint.xml

      - name: Run tests and build installable APK plus Play-format AAB
        working-directory: android/upstream
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug bundleRelease --no-daemon

      - name: Record APK package metadata and debug signing identity
        run: |
          set -euo pipefail
          APK="android/upstream/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$APK"
          mkdir -p android/upstream/app/build/outputs/release-report
          {
            echo "PRYNCE TV build metadata"
            echo "Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "APK package metadata (aapt dump badging)"
            "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:)"
            echo
            echo "APK signature verification and certificate"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          } | tee android/upstream/app/build/outputs/release-report/apk-metadata-and-signing.txt

      - name: Record package checksums
        run: |
          cd android/upstream/app/build/outputs
          { find apk/debug -type f -name '*.apk' -print0; find bundle/release -type f -name '*.aab' -print0; } | sort -z | xargs -0 sha256sum | tee prynce-tv-checksums.txt

      - name: Upload public-test APK and Play-format AAB
        uses: actions/upload-artifact@v4
        with:
          name: prynce-tv-v0.11.10-test-packages
          path: |
            android/upstream/app/build/outputs/apk/debug/*.apk
            android/upstream/app/build/outputs/bundle/release/*.aab
            android/upstream/app/build/outputs/prynce-tv-checksums.txt
            android/upstream/app/build/outputs/release-report/*.txt
          if-no-files-found: error
          retention-days: 90

      - name: Run Android Gradle Lint
        if: always()
        working-directory: android/upstream
        run: |
          chmod +x gradlew
          ./gradlew lint --no-daemon

      - name: Upload Android Lint XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prynce-tv-android-lint-reports
          path: |
