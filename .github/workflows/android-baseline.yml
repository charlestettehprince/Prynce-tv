name: PRYNCE TV Android build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-baseline.yml"
      - ".gitmodules"
      - "android/**"
      - "branding/**"
      - "docs/**"
      - "README.md"

concurrency:
  group: prynce-tv-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-upstream-baseline:
    name: Build PRYNCE TV branded Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRYNCE TV project and pinned Android source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PRYNCE TV launcher artwork
        run: |
          mkdir -p android/upstream/app/src/main/res/drawable
          rm -f android/upstream/app/src/main/res/drawable/ic_launcher.png android/upstream/app/src/main/res/drawable/banner.png
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          out = Path("android/upstream/app/src/main/res/drawable")
          icon = Image.open("branding/prynce_tv_icon.png").convert("RGBA")
          icon = ImageOps.fit(icon, (512, 512), method=Image.Resampling.LANCZOS)
          icon.save(out / "ic_launcher.png", optimize=True)
          banner = Image.open("branding/prynce_tv_banner.png").convert("RGBA")
          banner = ImageOps.fit(banner, (320, 180), method=Image.Resampling.LANCZOS)
          background = Image.new("RGB", (320, 180), "#080B14")
          background.paste(banner, mask=banner.getchannel("A"))
          background.save(out / "banner.png", optimize=True)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/upstream/**/*.gradle*

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android phone and TV launcher resources
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("app/src/main/AndroidManifest.xml")
          root = ET.parse(manifest).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          assert app is not None, "Android application element is missing"

          for attr in ("icon", "banner"):
              value = app.get(android + attr, "")
              assert value.startswith("@drawable/"), f"Missing drawable reference for application {attr}: {value}"
              name = value.split("/", 1)[1]
              matches = list(Path("app/src/main/res").glob(f"drawable*/{name}.*"))
              assert matches, f"Referenced {attr} drawable not found: {value}"

          categories = {
              item.get(android + "name")
              for activity in root.findall(".//activity")
              for intent in activity.findall("intent-filter")
              for item in intent.findall("category")
          }
          assert "android.intent.category.LAUNCHER" in categories, "Phone launcher category is missing"
          assert "android.intent.category.LEANBACK_LAUNCHER" in categories, "Android TV launcher category is missing"
          print("Phone and Android TV launcher declarations and referenced artwork are present.")
          PY

      - name: Apply PRYNCE TV black-and-gold branding
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path("app/src/main/res/values/strings.xml")
          text = strings.read_text()
          text = re.sub(r'(<string name="app_name">).*?(</string>)', lambda m: m.group(1) + "PRYNCE TV" + m.group(2), text, count=1)
          text = re.sub(r'(<string name="exit_title">).*?(</string>)', lambda m: m.group(1) + "Leave PRYNCE TV?" + m.group(2), text, count=1)
          strings.write_text(text)

          colors = Path("app/src/main/res/values/colors.xml")
          text = colors.read_text().replace("#FF7C93FF", "#FFD4AF37")
          colors.write_text(text)

          theme = Path("app/src/main/java/app/opentv/ui/theme/Theme.kt")
          text = theme.read_text()
          text = text.replace("0xFF7C93FF", "0xFFD4AF37")
          text = text.replace("0xFF4B5DB8", "0xFF8A6D1D")
          text = text.replace("0xFF3B4FCC", "0xFF9A7820")
          theme.write_text(text)

          # PRYNCE launcher art is installed from committed source-derived assets.

          # Keep the in-app navigation brand consistent with the launcher and app label.
          main_screen = Path("app/src/main/java/app/opentv/ui/MainScreen.kt")
          text = main_screen.read_text()
          text = text.replace('"OpenTV"', '"PRYNCE TV"')
          main_screen.write_text(text)
          PY

      - name: Validate committed artwork dimensions and opacity
        run: |
          python3 - <<'PY'
          from PIL import Image
          icon = Image.open("android/upstream/app/src/main/res/drawable/ic_launcher.png")
          banner = Image.open("android/upstream/app/src/main/res/drawable/banner.png")
          assert icon.size == (512, 512), f"Prepared launcher icon must be 512x512; found {icon.size}"
          assert banner.size == (320, 180), f"Prepared TV banner must be 320x180; found {banner.size}"
          assert banner.mode == "RGB", f"Prepared TV banner must be opaque RGB; found {banner.mode}"
          print("Prepared store icon and opaque Android TV banner dimensions passed.")
          PY

      - name: Run tests and build installable APK plus Play-format AAB
        working-directory: android/upstream
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug bundleRelease --no-daemon

      - name: Record package checksums
        run: |
          cd android/upstream/app/build/outputs
          find apk/debug bundle/release -type f \\( -name '*.apk' -o -name '*.aab' \\) -print0 | sort -z | xargs -0 sha256sum | tee prynce-tv-checksums.txt

      - name: Upload public-test APK and Play-format AAB
        uses: actions/upload-artifact@v4
        with:
          name: prynce-tv-v0.11.10-test-packages
          path: |
            android/upstream/app/build/outputs/apk/debug/*.apk
            android/upstream/app/build/outputs/bundle/release/*.aab
            android/upstream/app/build/outputs/prynce-tv-checksums.txt
          if-no-files-found: error
          retention-days: 90
