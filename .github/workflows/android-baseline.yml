name: PRYNCE TV Android build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-baseline.yml"
      - ".gitmodules"
      - "android/**"
      - "branding/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build-upstream-baseline:
    name: Build PRYNCE TV branded Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRYNCE TV project and pinned Android source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/upstream/**/*.gradle*

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare supplied PRYNCE logo assets
        run: |
          python3 -m pip install --user cairosvg
          mkdir -p android/upstream/app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="branding/prynce_icon.svg", write_to="android/upstream/app/src/main/res/drawable-nodpi/prynce_icon.png", output_width=512, output_height=512)
          cairosvg.svg2png(url="branding/prynce_wordmark.svg", write_to="android/upstream/app/src/main/res/drawable-nodpi/prynce_wordmark.png", output_width=1200, output_height=380)
          PY

      - name: Apply PRYNCE TV black-and-gold branding
        working-directory: android/upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path("app/src/main/res/values/strings.xml")
          text = strings.read_text()
          text = re.sub(r'(<string name="app_name">).*?(</string>)', lambda m: m.group(1) + "PRYNCE TV" + m.group(2), text, count=1)
          text = re.sub(r'(<string name="exit_title">).*?(</string>)', lambda m: m.group(1) + "Leave PRYNCE TV?" + m.group(2), text, count=1)
          strings.write_text(text)

          colors = Path("app/src/main/res/values/colors.xml")
          text = colors.read_text().replace("#FF7C93FF", "#FFD4AF37")
          colors.write_text(text)

          theme = Path("app/src/main/java/app/opentv/ui/theme/Theme.kt")
          text = theme.read_text()
          text = text.replace("0xFF7C93FF", "0xFFD4AF37")
          text = text.replace("0xFF4B5DB8", "0xFF8A6D1D")
          text = text.replace("0xFF3B4FCC", "0xFF9A7820")
          theme.write_text(text)

          # Use the user's supplied square Prynce mark as the launcher icon.
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text().replace('android:icon="@drawable/ic_launcher"', 'android:icon="@drawable/prynce_icon"')
          manifest.write_text(text)

          # Keep the in-app navigation brand consistent with the launcher and app label.
          # Use the user's exact horizontal wordmark when the rail expands.
          main_screen = Path("app/src/main/java/app/opentv/ui/MainScreen.kt")
          text = main_screen.read_text()
          import re
          pattern = re.compile(
              r'            Image\\(\\n.*?            \\}\\n        \\}\\n        Spacer\\(Modifier\\.height\\(8\\.dp\\)\\)',
              re.DOTALL,
          )
          new = """            Image(
                  painter = painterResource(if (expanded) R.drawable.prynce_wordmark else R.drawable.prynce_icon),
                  contentDescription = "PRYNCE",
                  modifier = Modifier
                      .width(if (expanded) 154.dp else 34.dp)
                      .height(if (expanded) 49.dp else 34.dp),
              )
          }
          Spacer(Modifier.height(8.dp))"""
          updated, count = pattern.subn(lambda _: new, text, count=1)
          if count != 1:
              raise SystemExit("Navigation logo block not found; refusing unsafe replacement")
          main_screen.write_text(updated)

          PY

      - name: Run tests and build PRYNCE TV debug APK
        working-directory: android/upstream
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon

      - name: Upload PRYNCE TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prynce-tv-v0.11.10-debug
          path: android/upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
